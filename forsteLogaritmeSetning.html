<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logaritmeoppgaver</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 20px;
    background-color: #f5f7fb;
}

h1 {
    text-align: center;
    color: #1e3a8a;
}

.oppgave {
    background: white;
    padding: 20px;
    margin: 20px 0;
    border-left: 5px solid #2563eb;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.uttrykk {
    font-size: 1.4em;
    font-weight: bold;
    margin: 10px 0;
}

button {
    background-color: #2563eb;
    color: white;
    border: none;
    padding: 10px 12px;
    margin-right: 10px;
    margin-top: 10px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #1d4ed8;
}

.hint, .losning {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 5px;
}

.hint {
    background-color: #fff7cc;
}

.losning {
    background-color: #dff7df;
}

.regning {
    margin-top: 8px;
    line-height: 1.7;
    font-family: Consolas, monospace;
}

.language-bar{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
}

.flag{
    width:60px;
    height:40px;
    cursor:pointer;
    border-radius:4px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
    transition:transform .2s;
}

.flag:hover{
    transform:scale(1.1);
}

/* Norsk flagg */

.norwegian{
    position:relative;
    width:60px;
    height:40px;
    cursor:pointer;
    border-radius:4px;
    overflow:hidden;
    background:#cd3d2e;
}

.norwegian::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to right,
        transparent 28%,
        white 28%,
        white 42%,
        transparent 42%
    ),
    linear-gradient(
        to bottom,
        transparent 40%,
        white 40%,
        white 60%,
        transparent 60%
    );
}

.counter{
    text-align:center;
    margin-bottom:20px;
}

.norwegian::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to right,
        transparent 32%,
        #34495e 32%,
        #34495e 38%,
        transparent 38%
    ),
    linear-gradient(
        to bottom,
        transparent 43%,
        #34495e 43%,
        #34495e 57%,
        transparent 57%
    );
}

/* Britisk flagg (forenklet CSS-versjon) */

.british{
    width:60px;
    height:40px;
    cursor:pointer;
    border-radius:4px;
    overflow:hidden;

    background:

    /* rødt senterkors */
    linear-gradient(
        transparent 42%,
        #c8102e 42%,
        #c8102e 58%,
        transparent 58%
    ),

    linear-gradient(
        90deg,
        transparent 42%,
        #c8102e 42%,
        #c8102e 58%,
        transparent 58%
    ),

    /* hvitt senterkors */
    linear-gradient(
        transparent 35%,
        white 35%,
        white 65%,
        transparent 65%
    ),

    linear-gradient(
        90deg,
        transparent 35%,
        white 35%,
        white 65%,
        transparent 65%
    ),

    /* røde diagonaler (St Patrick) */
    linear-gradient(
        33deg,
        transparent 45%,
        #c8102e 45%,
        #c8102e 50%,
        transparent 50%
    ),

    linear-gradient(
        -33deg,
        transparent 50%,
        #c8102e 50%,
        #c8102e 55%,
        transparent 55%
    ),

    /* hvite diagonaler */
    linear-gradient(
        33deg,
        transparent 40%,
        white 40%,
        white 60%,
        transparent 60%
    ),

    linear-gradient(
        -33deg,
        transparent 40%,
        white 40%,
        white 60%,
        transparent 60%
    ),

    #012169;
}

</style>
</head>

<body>
    <div class="language-bar">

    <div class="flag norwegian" onclick="setLanguage('no')"
         title="Norsk"></div>

    <div class="flag british" onclick="setLanguage('en')"
         title="English"></div>

</div>

<div class="counter">
    <img
        src="https://visitor-badge.laobi.icu/badge?page_id=magnusstoylen.logaritmer"
        alt="Visitor Counter">
</div>

<h1 id="title">Forenkling av logaritmeuttrykk</h1>

<p id="description">
    <strong>Oppgave:</strong>
    Forenkle uttrykket så mye som mulig ved hjelp av første logaritmesetning.
</p>



<div id="container"></div>

<script>
let currentLanguage = "no";

const tasks = [

{
oppgave: "ln(6x)",
hint_no: "Kan produktet deles opp?",
hint_en: "Can the product be split up?",
losning: "ln(6x)<br>= ln(6)+ln(x)"
},

{
oppgave: "ln(3xy)",
hint_no: "Hvilke faktorer består uttrykket av?",
hint_en: "What factors make up the expression?",
losning: "ln(3xy)<br>= ln(3)+ln(x)+ln(y)"
},

{
oppgave: "ln(4a²)",
hint_no: "Skill faktorene fra hverandre.",
hint_en: "Separate the factors.",
losning: "ln(4a²)<br>= ln(4)+ln(a²)"
},

{
oppgave: "ln(x)+ln(7)",
hint_no: "Kan logaritmene slås sammen?",
hint_en: "Can the logarithms be combined?",
losning: "ln(x)+ln(7)<br>= ln(7x)"
},

{
oppgave: "ln((x-1)(x+1))",
hint_no: "Bruk logaritmesetningen motsatt vei.",
hint_en: "Use the logarithm rule in reverse.",
losning: "ln((x-1)(x+1))<br>= ln(x-1)+ln(x+1)"
},

{
oppgave: "ln(10ab)",
hint_no: "Splitt opp produktet.",
hint_en: "Split the product.",
losning: "ln(10ab)<br>= ln(10)+ln(a)+ln(b)"
},

{
oppgave: "ln(x)+ln(x)",
hint_no: "Slå sammen først.",
hint_en: "Combine first.",
losning: "ln(x)+ln(x)<br>= ln(x²)"
},

{
oppgave: "ln(x²(x+1))",
hint_no: "Produktet kan deles opp.",
hint_en: "The product can be separated.",
losning: "ln(x²(x+1))<br>= ln(x²)+ln(x+1)"
},

{
oppgave: "ln((x+3)(x-2)(x+5))",
hint_no: "Del opp i flere logaritmer.",
hint_en: "Split into several logarithms.",
losning:
"ln((x+3)(x-2)(x+5))<br>" +
"= ln(x+3)+ln(x-2)+ln(x+5)"
},

{
oppgave: "ln(2)+ln(5)+ln(x)",
hint_no: "Slå sammen gradvis.",
hint_en: "Combine gradually.",
losning:
"ln(2)+ln(5)+ln(x)<br>" +
"= ln(10x)"
},

{
oppgave: "ln(x(x+4))",
hint_no: "Bruk formelen motsatt vei.",
hint_en: "Use the formula in reverse.",
losning:
"ln(x(x+4))<br>" +
"= ln(x)+ln(x+4)"
},

{
oppgave: "ln(x²-9)",
hint_no: "Faktoriser først.",
hint_en: "Factor first.",
losning:
"x²-9=(x-3)(x+3)<br><br>" +
"ln(x²-9)<br>" +
"= ln(x-3)+ln(x+3)"
},

{
oppgave: "ln(x²+6x+9)",
hint_no: "Kan uttrykket skrives som et produkt?",
hint_en: "Can the expression be written as a product?",
losning:
"x²+6x+9=(x+3)(x+3)<br><br>" +
"ln(x²+6x+9)<br>" +
"= ln(x+3)+ln(x+3)"
},

{
oppgave: "ln(x²+2x)",
hint_no: "Se etter en felles faktor.",
hint_en: "Look for a common factor.",
losning:
"x²+2x=x(x+2)<br><br>" +
"ln(x²+2x)<br>" +
"= ln(x)+ln(x+2)"
},
{
oppgave: "ln(4x²-1)",
hint_no: "Forskjell av to kvadrater.",
hint_en: "Difference of two squares.",
losning:
"4x²-1=(2x-1)(2x+1)<br><br>" +
"ln(4x²-1)<br>" +
"= ln(2x-1)+ln(2x+1)"
},

{
oppgave: "ln(x)+ln(x-1)+ln(x+1)",
hint_no: "Slå sammen alle logaritmene.",
hint_en: "Combine all logarithms.",
losning:
"ln(x)+ln(x-1)+ln(x+1)<br>" +
"= ln(x(x-1)(x+1))"
},

{
oppgave: "ln(x(x-1)(x+1))",
hint_no: "Del opp produktet.",
hint_en: "Split the product.",
losning:
"ln(x(x-1)(x+1))<br>" +
"= ln(x)+ln(x-1)+ln(x+1)"
},

{
oppgave: "ln(x²-4)+ln(x+2)",
hint_no: "Faktoriser og tenk deretter.",
hint_en: "Factor first, then think.",
losning:
"x²-4=(x-2)(x+2)<br><br>" +
"ln(x²-4)+ln(x+2)<br>" +
"= ln((x-2)(x+2)²)"
},

{
oppgave: "ln((x-2)(x+2)²)",
hint_no: "Del opp så langt som mulig.",
hint_en: "Split as far as possible.",
losning:
"ln((x-2)(x+2)²)<br>" +
"= ln(x-2)+ln((x+2)²)"
},

{
oppgave: "ln(x³-x)",
hint_no: "Faktoriser først og del deretter opp.",
hint_en: "Factor first and then split.",
losning:
"x³-x=x(x²-1)<br>" +
"=x(x-1)(x+1)<br><br>" +
"ln(x³-x)<br>" +
"=ln(x)+ln(x-1)+ln(x+1)"
},

{
oppgave: "ln(x)+ln(x²-1)",
hint_no: "Faktoriser og slå sammen.",
hint_en: "Factor and combine.",
losning:
"x²-1=(x-1)(x+1)<br><br>" +
"ln(x)+ln(x²-1)<br>" +
"=ln(x(x-1)(x+1))"
},

{
oppgave: "ln(x⁴-1)",
hint_no: "Faktoriser helt før du bruker logaritmesetningen.",
hint_en: "Factor completely before using the logarithm rule.",
losning:
"x⁴-1=(x²-1)(x²+1)<br>" +
"=(x-1)(x+1)(x²+1)<br><br>" +
"ln(x⁴-1)<br>" +
"=ln(x-1)+ln(x+1)+ln(x²+1)"
},

{
oppgave: "ln(x-1)+ln(x+1)+ln(x²+1)",
hint_no: "Kan dette skrives som én logaritme?",
hint_en: "Can this be written as a single logarithm?",
losning:
"ln(x-1)+ln(x+1)+ln(x²+1)<br>" +
"= ln((x-1)(x+1)(x²+1))"
}


];

const texts = {

no : {

title : "Forenkling av logaritmeuttrykk",

description :
"<strong>Oppgave:</strong> Forenkle uttrykket så mye som mulig ved hjelp av første logaritmesetning.",

showHint : "Vis/skjul hint",

showSolution : "Vis/skjul løsning",

hintLabel : "Hint:",

solutionLabel : "Løsning:",

taskLabel : "Oppgave"

},

en : {

title : "Simplifying logarithmic expressions",

description :
"<strong>Task:</strong> Simplify the expression as much as possible using the first logarithm rule.",

showHint : "Show/Hide Hint",

showSolution : "Show/Hide Solution",

hintLabel : "Hint:",

solutionLabel : "Solution:",

taskLabel : "Exercise"

}

};




function toggle(id){

    const element = document.getElementById(id);

    if(element.style.display === "block"){
        element.style.display = "none";
    } else {
        element.style.display = "block";
    }
}

function renderTasks(){

    const lang = texts[currentLanguage];

    document.getElementById("title").innerHTML =
        lang.title;

    document.getElementById("description").innerHTML =
        lang.description;

    const container =
        document.getElementById("container");

    container.innerHTML = "";

    tasks.forEach((o,index)=>{

        container.innerHTML += `
        <div class="oppgave">

            <h3>${lang.taskLabel} ${index+1}</h3>

            <div class="uttrykk">
                ${o.oppgave}
            </div>

            <button onclick="toggle('hint${index}')">
                ${lang.showHint}
            </button>

            <button onclick="toggle('losning${index}')">
                ${lang.showSolution}
            </button>

            <div class="hint" id="hint${index}">
                <strong>${lang.hintLabel}</strong><br>
                ${
                    currentLanguage === "no"
                    ? o.hint_no
                    : o.hint_en
                }
            </div>

            <div class="losning" id="losning${index}">
                <strong>${lang.solutionLabel}</strong><br>
                ${o.losning}
            </div>

        </div>
        `;
    });
}

function setLanguage(lang){

    currentLanguage = lang;

    document.documentElement.lang = lang;

    renderTasks();
}

renderTasks();

</script>

</body>
</html>
